name: macOS build
on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/macos.yml"
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/macos.yml"
  workflow_dispatch:
concurrency:
  group: scribe-macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Report runner and Swift version
        run: uname -m && swift --version
      - name: Build and package Apple Silicon app
        working-directory: desktop
        run: bash scripts/package-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: scribe-macos-app
          path: desktop/build/Scribe-macOS.zip
          if-no-files-found: error
          retention-days: 30

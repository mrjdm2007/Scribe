name: Scribe macOS CI
on:
  push:
    branches: ["**"]
    paths: ["macos/**", ".github/workflows/macos.yml"]
  pull_request:
    branches: ["main"]
    paths: ["macos/**", ".github/workflows/macos.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Report runner architecture
        run: uname -m && swift --version
      - name: Build macOS app
        working-directory: macos
        run: |
          swift test
          bash scripts/package-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: scribe-macos-app
          path: macos/build/Scribe-macOS.zip
          if-no-files-found: error
          retention-days: 30

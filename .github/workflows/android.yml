name: Android CI
on:
  push:
    branches: ["main", "feature/**"]
    paths: ["app/**", "gradle/**", "supabase/schema.sql", "build.gradle.kts", "settings.gradle.kts", "gradle.properties", "gradlew", ".github/workflows/android.yml"]
  pull_request:
    branches: ["main"]
    paths: ["app/**", "gradle/**", "build.gradle.kts", "settings.gradle.kts", "gradle.properties", "gradlew", ".github/workflows/android.yml"]
  workflow_dispatch:
concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest
      - name: Build optimized release APK
        run: gradle :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: scribe-release-apk
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30
